kind = "mobile"
previewPath = "/"
title = "Skillect"
version = "1.0.0"
id = "artifacts/skillect"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 24346

[services.development]
run = "pnpm --filter @workspace/skillect run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/skillect", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/skillect", "run", "serve" ]

[services.env]
PORT = "24346"
BASE_PATH = "/"
