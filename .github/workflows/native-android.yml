name: Native Android build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "debug or signed-release (requires upload keystore secrets)"
        required: true
        type: choice
        options:
          - signed-release
          - debug
        default: signed-release
  pull_request:
    branches:
      - main
  push:
    branches:
      - native/android-ios-foundation
      - native/skillect-ui-parity
      - native/complete-social-app-phase-1-auth
    paths:
      - "native/android/**"
      - ".github/workflows/native-android.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android-build:
    env:
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'debug' }}
        working-directory: native/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: skillect-native-android-debug
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Verify signing secrets
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'signed-release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing KEY_PASSWORD" && exit 1)
      - name: Restore upload keystore
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'signed-release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/skillect-upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/skillect-upload.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK and AAB
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'signed-release' }}
        working-directory: native/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease
      - name: Upload signed release packages
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'signed-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: skillect-native-android-signed-release
          path: |
            native/android/app/build/outputs/apk/release/app-release.apk
            native/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
