name: Native Android build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "debug or signed-release"
        required: true
        type: choice
        options:
          - debug
          - signed-release
        default: signed-release
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - native/android-ios-foundation
      - native/skillect-ui-parity
    paths:
      - "native/android/**"
      - ".github/workflows/native-android.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android-build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore, feature-patch, polish, slices 1-6
        run: |
          set -euo pipefail
          TARGET="native/android/app/src/main/java/com/skillect/app/MainActivity.kt"
          echo "Restoring MainActivity from known-good commit"
          curl -fsSL -o "$TARGET" \
            "https://raw.githubusercontent.com/sd9282726-rgb/Skillectt/f88c8f0617db8d3188ebf9a66f6e9e0f4ca16e7c/native/android/app/src/main/java/com/skillect/app/MainActivity.kt"
          python3 native/android/scripts/apply_features.py "$TARGET"
          python3 native/android/scripts/polish_features.py "$TARGET"
          python3 native/android/scripts/slices_1_to_6.py "$TARGET"
          wc -c "$TARGET"
          grep -n "AuthGate\|SettingsScreen\|loadBlocked\|leaveCommunity\|Notifications\|followUser" "$TARGET" | head -30

      - name: Commit MainActivity to main
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/android/app/src/main/java/com/skillect/app/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No MainActivity changes to commit"
          else
            git commit -m "MainActivity: slices 1-6 settings notifications privacy communities"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' }}
        working-directory: native/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: skillect-native-android-debug
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Verify signing secrets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'signed-release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing KEY_PASSWORD" && exit 1)

      - name: Restore upload keystore
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'signed-release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/skillect-upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/skillect-upload.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'signed-release' }}
        working-directory: native/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Upload signed release packages
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'signed-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: skillect-native-android-signed-release
          path: |
            native/android/app/build/outputs/apk/release/app-release.apk
            native/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
