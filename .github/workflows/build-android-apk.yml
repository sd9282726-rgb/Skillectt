name: Build Skillect APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      CI: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true
          echo "$ANDROID_HOME/build-tools/35.0.0" >> $GITHUB_PATH

      - name: Install JS deps
        run: |
          cd mobile
          npm install
          npm install expo-asset@~11.0.5 expo-constants --save

      - name: Create placeholder assets
        run: |
          cd mobile
          mkdir -p assets
          python3 -c "
          import struct,zlib
          from pathlib import Path
          def png(w,h,rgb=(37,99,235)):
            def chunk(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
            raw=b''.join(b'\x00'+bytes(rgb)*w for _ in range(h))
            return b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b'')
          for n in ['icon.png','adaptive-icon.png','splash.png','favicon.png']:
            Path('assets',n).write_bytes(png(1024,1024))
          print('assets ok')
          "

      - name: Expo prebuild
        run: |
          cd mobile
          npx expo prebuild --platform android

      - name: Fix Kotlin version + local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > mobile/android/local.properties
          cat > mobile/android/gradle.properties << EOF
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          newArchEnabled=false
          hermesEnabled=true
          android.suppressKotlinVersionCompatibilityCheck=true
          kotlin.version=1.9.25
          EOF
          # Force Kotlin 1.9.25 in root build.gradle if present
          if [ -f mobile/android/build.gradle ]; then
            sed -i 's/kotlinVersion\s*=.*/kotlinVersion = "1.9.25"/' mobile/android/build.gradle || true
            sed -i "s/ext.kotlin_version.*/ext.kotlin_version = '1.9.25'/" mobile/android/build.gradle || true
            if ! grep -q "kotlinVersion" mobile/android/build.gradle; then
              sed -i '/buildscript/a\    ext.kotlinVersion = "1.9.25"' mobile/android/build.gradle || true
            fi
          fi
          # Also patch settings/libs if expo uses version catalog
          find mobile/android -name "*.gradle*" -o -name "libs.versions.toml" 2>/dev/null | head -20
          grep -r "1.9.24\|kotlinVersion\|kotlin_version" mobile/android --include="*.gradle*" --include="*.toml" 2>/dev/null | head -20 || true

      - name: Build release APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease -x lint -x test --stacktrace

      - name: Sign APK with release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          PASS="${KEYSTORE_PASSWORD:-SkillectRelease2026!}"
          ALIAS="${KEY_ALIAS:-skillect}"
          KPASS="${KEY_PASSWORD:-$PASS}"
          mkdir -p dist
          SRC=$(find mobile/android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "Source APK: $SRC"
          cp "$SRC" dist/skillect-unsigned.apk

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > skillect-release.jks
            $ANDROID_HOME/build-tools/35.0.0/zipalign -f -p 4 dist/skillect-unsigned.apk dist/skillect-aligned.apk
            $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
              --ks skillect-release.jks \
              --ks-key-alias "$ALIAS" \
              --ks-pass pass:"$PASS" \
              --key-pass pass:"$KPASS" \
              --out dist/Skillect-1.0.2-release.apk \
              dist/skillect-aligned.apk
            $ANDROID_HOME/build-tools/35.0.0/apksigner verify dist/Skillect-1.0.2-release.apk
            echo "Signed APK ready"
          else
            cp dist/skillect-unsigned.apk dist/Skillect-1.0.2-release.apk
            echo "WARNING: no keystore secret"
          fi
          ls -lh dist/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Skillect-release-apk
          path: dist/Skillect-1.0.2-release.apk
          if-no-files-found: error
