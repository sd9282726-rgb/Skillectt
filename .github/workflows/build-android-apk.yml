name: Build Skillect APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      CI: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK (manual)
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install JS deps
        run: |
          cd mobile
          npm install
          npm install expo-asset@~11.0.5 expo-constants --save

      - name: Create placeholder assets
        run: |
          cd mobile
          mkdir -p assets
          python3 << 'PY'
          import struct, zlib
          from pathlib import Path
          def png(w, h, rgb=(37, 99, 235)):
              def chunk(t, d):
                  return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
              raw = b"".join(b"\x00" + bytes(rgb) * w for _ in range(h))
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
          for name in ["icon.png", "adaptive-icon.png", "splash.png", "favicon.png"]:
              Path("assets", name).write_bytes(png(1024, 1024))
          print("assets ready")
          PY

      - name: Expo prebuild
        run: |
          cd mobile
          npx expo prebuild --platform android

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > mobile/android/local.properties

      - name: Decode keystore + patch signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > mobile/android/gradle.properties << EOF
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          newArchEnabled=false
          hermesEnabled=true
          EOF

          PASS="${KEYSTORE_PASSWORD:-SkillectRelease2026!}"
          ALIAS="${KEY_ALIAS:-skillect}"
          KPASS="${KEY_PASSWORD:-$PASS}"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > mobile/skillect-release.jks
            KS="$(pwd)/mobile/skillect-release.jks"
            echo "Keystore at $KS"

            python3 - "$KS" "$PASS" "$ALIAS" "$KPASS" << 'PY'
          import sys
          from pathlib import Path
          ks, pwd, alias, kpwd = sys.argv[1:5]
          p = Path("mobile/android/app/build.gradle")
          t = p.read_text()

          # Add release signingConfigs if missing
          release_cfg = f'''
        release {{
            storeFile file("{ks}")
            storePassword "{pwd}"
            keyAlias "{alias}"
            keyPassword "{kpwd}"
        }}
'''
          if "keyAlias" not in t:
              if "signingConfigs {" in t:
                  t = t.replace("signingConfigs {", "signingConfigs {" + release_cfg, 1)
              else:
                  # inject before buildTypes
                  t = t.replace(
                      "buildTypes {",
                      "signingConfigs {\n" + release_cfg + "    }\n    buildTypes {",
                      1,
                  )

          # Point release buildType to release signing
          t = t.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release",
          )
          # common expo pattern: only debug has signingConfig; ensure release uses it
          if "release {" in t and "signingConfig signingConfigs.release" not in t.split("release {")[1][:400]:
              t = t.replace(
                  "release {",
                  "release {\n            signingConfig signingConfigs.release",
                  1,
              )

          p.write_text(t)
          print("signing patched")
          PY
          else
            echo "No keystore secret — using default debug signing"
          fi

      - name: Build release APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease -x lint -x test --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Skillect-release-apk
          path: mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
