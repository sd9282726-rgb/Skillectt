name: Build Skillect APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  android:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install npm packages
        working-directory: mobile
        run: |
          npm install
          npm install expo-asset expo-constants --save || true

      - name: Prebuild Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --non-interactive

      - name: local.properties
        working-directory: mobile
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > mobile/skillect-release.jks
            echo "Keystore OK"
          else
            echo "WARNING: KEYSTORE_BASE64 secret missing"
          fi

      - name: Gradle memory + signing
        working-directory: mobile
        env:
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          newArchEnabled=false
          hermesEnabled=true
          EOF
          PASS="${KP:-SkillectRelease2026!}"
          ALIAS="${KA:-skillect}"
          KPASSW="${KPASS:-$PASS}"
          if [ -f skillect-release.jks ]; then
            KS_PATH="$(pwd)/skillect-release.jks"
            python3 - "$KS_PATH" "$PASS" "$ALIAS" "$KPASSW" << 'PY'
          import sys
          from pathlib import Path
          ks, pwd, alias, kpwd = sys.argv[1:5]
          p = Path("android/app/build.gradle")
          t = p.read_text()
          if f'storeFile file("{ks}")' not in t:
              insert = f'''
        release {{
            storeFile file("{ks}")
            storePassword "{pwd}"
            keyAlias "{alias}"
            keyPassword "{kpwd}"
        }}
'''
              if "signingConfigs {" in t:
                  t = t.replace("signingConfigs {", "signingConfigs {" + insert, 1)
              t = t.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
              p.write_text(t)
              print("signing patched")
          else:
              print("signing already set")
          PY
          fi

      - name: Assemble release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -x lint -x test --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Skillect-release-apk
          path: mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
