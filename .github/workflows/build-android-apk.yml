name: Build Skillect APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JS deps
        run: |
          cd mobile
          npm install
          npm install expo-asset@~11.0.5 expo-constants --save

      - name: Expo prebuild
        run: |
          cd mobile
          npx expo prebuild --platform android --non-interactive

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > mobile/android/local.properties

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > mobile/skillect-release.jks
            echo "Keystore decoded"
          else
            echo "No KEYSTORE_BASE64 — release may use debug signing"
          fi

      - name: Configure Gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > mobile/android/gradle.properties << EOF
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          newArchEnabled=false
          hermesEnabled=true
          EOF

          PASS="${KEYSTORE_PASSWORD:-SkillectRelease2026!}"
          ALIAS="${KEY_ALIAS:-skillect}"
          KPASS="${KEY_PASSWORD:-$PASS}"
          KS="$(pwd)/mobile/skillect-release.jks"

          if [ -f "$KS" ]; then
            cat > mobile/android/keystore.properties << EOF
          storeFile=$KS
          storePassword=$PASS
          keyAlias=$ALIAS
          keyPassword=$KPASS
          EOF
            echo "keystore.properties written"
            sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/g' mobile/android/app/build.gradle || true
          fi

      - name: Build release APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease -x lint -x test --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Skillect-release-apk
          path: mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
