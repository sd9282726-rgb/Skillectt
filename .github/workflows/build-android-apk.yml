name: Build Skillect Native Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - native/complete-social-app-phase-1-auth
    paths:
      - "native/android/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

concurrency:
  group: skillect-native-android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed native APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "::error::Missing KEYSTORE_BASE64 repository secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "::error::Missing KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "::error::Missing KEY_ALIAS repository secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "::error::Missing KEY_PASSWORD repository secret" && exit 1)

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/skillect-upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/skillect-upload.jks" >> "$GITHUB_ENV"

      - name: Build native release APK and app bundle
        working-directory: native/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon clean :app:assembleRelease :app:bundleRelease

      - name: Verify APK signature
        run: |
          APK="native/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/Skillect-native-release.apk
          cp native/android/app/build/outputs/bundle/release/app-release.aab dist/Skillect-native-release.aab

      - name: Upload signed native release files
        uses: actions/upload-artifact@v4
        with:
          name: Skillect-native-Android-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30
