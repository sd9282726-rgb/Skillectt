name: Build Skillect Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          npm install
          npx expo install expo-asset expo-constants || true

      - name: Expo prebuild Android
        run: |
          npx expo prebuild --platform android --no-install

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Decode keystore (optional secret)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/skillect-release.jks
            echo "Keystore decoded"
          else
            echo "No KEYSTORE_BASE64 secret — will use debug signing (Amazon may reject)"
          fi

      - name: Configure release signing + memory
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat >> android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          org.gradle.daemon=true
          org.gradle.parallel=true
          android.useAndroidX=true
          newArchEnabled=false
          hermesEnabled=true
          EOF

          python3 << 'PY'
          import os, re
          from pathlib import Path
          p = Path('android/app/build.gradle')
          t = p.read_text()
          # bump version if present
          t = re.sub(r'versionCode\s+\d+', 'versionCode 3', t)
          t = re.sub(r'versionName\s+"[^"]+"', 'versionName "1.0.2"', t)

          ks = '/tmp/skillect-release.jks'
          pwd = os.environ.get('KEYSTORE_PASSWORD') or 'SkillectRelease2026!'
          alias = os.environ.get('KEY_ALIAS') or 'skillect'
          kpwd = os.environ.get('KEY_PASSWORD') or pwd

          if Path(ks).exists():
              signing = f'''
      signingConfigs {{
          release {{
              storeFile file("{ks}")
              storePassword "{pwd}"
              keyAlias "{alias}"
              keyPassword "{kpwd}"
          }}
      }}
      buildTypes {{
          release {{
              signingConfig signingConfigs.release
              minifyEnabled false
              shrinkResources false
          }}
      }}
      '''
              # crude inject if signingConfigs not already release-ready
              if 'storeFile file("/tmp/skillect-release.jks")' not in t:
                  t = t.replace(
                      'signingConfig signingConfigs.debug',
                      'signingConfig signingConfigs.release',
                  )
                  if 'signingConfigs {' in t and 'release {' not in t.split('signingConfigs')[1][:400]:
                      t = t.replace('signingConfigs {', 'signingConfigs {\n        release {\n            storeFile file("/tmp/skillect-release.jks")\n            storePassword "' + pwd + '"\n            keyAlias "' + alias + '"\n            keyPassword "' + kpwd + '"\n        }', 1)
          p.write_text(t)
              print('signing configured')
          else:
              p.write_text(t)
              print('no keystore file; using existing gradle signing')
          PY

      - name: Assemble release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -x lint -x test --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Skillect-release-apk
          path: |
            mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
