name: Skillect web verification

on:
  push:
    branches: [main]
    paths:
      - "artifacts/skillect/**"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "supabase/functions/**"
      - ".github/workflows/skillect-web-check.yml"
  pull_request:
    paths:
      - "artifacts/skillect/**"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "supabase/functions/**"

permissions:
  contents: read

jobs:
  web:
    name: Typecheck and build Skillect web
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Build Skillect web app
        run: pnpm --filter @workspace/skillect build
