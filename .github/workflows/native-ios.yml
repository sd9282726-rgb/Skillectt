name: Native iOS build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - native/android-ios-foundation
      - native/skillect-ui-parity
      - native/complete-social-app-phase-1-auth
    paths:
      - "native/ios/**"
      - ".github/workflows/native-ios.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ios-simulator:
    timeout-minutes: 30
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build Release configuration for iOS Simulator
        run: |
          xcodebuild -project native/ios/Skillect.xcodeproj \
            -scheme Skillect \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO
      - name: Package simulator app
        run: |
          cd build/ios/Build/Products/Release-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/Skillect-iOS-Release-Simulator.zip" Skillect.app
      - uses: actions/upload-artifact@v4
        with:
          name: skillect-native-ios-release-simulator
          path: Skillect-iOS-Release-Simulator.zip
          retention-days: 14
